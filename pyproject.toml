[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmoforge"
version = "0.1.0"
description = "PharmoForge: 創薬支援ツール群"
requires-python = ">=3.14"
dependencies = [
    "requests",
    "click",
    "rdkit>=2026.03.5",
    "pandas",
    "pillow",
    "openmm",
    "pdbfixer",
    "prody",  # conda-forgeでのビルド提供が不安定なためpipでインストールする
    "biopython",
    "meeko",  # conda-forgeのビルドがpython<3.14までにしか対応していないためpipでインストールする
    "gemmi",  # 同上(meekoの依存)
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
pf = "core.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
